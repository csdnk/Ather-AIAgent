services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--save", "60", "1000", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379
    profiles: ["milvus"]

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    command: minio server /minio_data
    environment:
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-minioadmin}"
    profiles: ["milvus"]

  milvus:
    image: milvusdb/milvus:v2.4.17
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    depends_on:
      etcd:
        condition: service_started
      minio:
        condition: service_started
    ports:
      - "${AETHER_HOST_MILVUS_PORT:-19530}:19530"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 30
    profiles: ["milvus"]

  b1-sidecar:
    build:
      context: .
      args:
        INSTALL_B1_SIDECAR: "true"
    command: ["python", "-m", "aether_agent_memory.b1.sidecar"]
    environment:
      AETHER_B1_HOST: 0.0.0.0
      AETHER_B1_PORT: "18081"
      AETHER_B1_EAGER_LOAD: "true"
      AETHER_B1_CACHE_DIR: /app/.aether/b1/models
      AETHER_B1_THREADS: "1"
      AETHER_B1_MODEL_BATCH_SIZE: "8"
      AETHER_B1_MAX_CONCURRENCY: "1"
    volumes:
      - b1-model-cache:/app/.aether
    ports:
      - "${AETHER_HOST_B1_PORT:-18081}:18081"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:18081/health/ready', timeout=2).read()"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  engine:
    build:
      context: ./engine
    environment:
      AETHER_P2_DATA_DIR: /var/lib/aether-engine
    volumes:
      - engine-data:/var/lib/aether-engine
    ports:
      - "${AETHER_HOST_P2_PORT:-50052}:50052"
  p3:
    build:
      context: .
      args:
        INSTALL_B2_DATASET_TOOLS: "true"
    command: ["python", "-m", "aether_agent_memory.app"]
    depends_on:
      engine:
        condition: service_started
      redis:
        condition: service_healthy
      b1-sidecar:
        condition: service_healthy
    environment:
      AETHER_P2_GRPC: engine:50052
      AETHER_P2_ENGINE: object/default
      AETHER_P2_BUCKET: p3-memory
      AETHER_P2_COLLECTION: p3
      AETHER_P3_DATA_DIR: /var/lib/aether-p3
      AETHER_P3_PORT: "8080"
      AETHER_P3_RETRIEVAL_TRACE_TTL_SECONDS: "${AETHER_P3_RETRIEVAL_TRACE_TTL_SECONDS:-3600}"
      AETHER_P3_RETRIEVAL_TRACE_MAX_ENTRIES: "${AETHER_P3_RETRIEVAL_TRACE_MAX_ENTRIES:-1000}"
      AETHER_P3_RETRIEVAL_TRACE_TIMEOUT_SECONDS: "${AETHER_P3_RETRIEVAL_TRACE_TIMEOUT_SECONDS:-0.25}"
      AETHER_RUNTIME_PROFILE: "${AETHER_RUNTIME_PROFILE:-integration}"
      AETHER_ENABLE_DEMO: "${AETHER_ENABLE_DEMO:-false}"
      AETHER_B1_SIDECAR_URL: http://b1-sidecar:18081
      AETHER_B2_BROKER_URL: redis://redis:6379/0
      AETHER_B2_REDIS_URL: redis://redis:6379/0
      AETHER_B2_RESULT_BACKEND: redis://redis:6379/1
      AETHER_B2_TASK_STATUS_URL: redis://redis:6379/2
      AETHER_B2_MILVUS_URI: http://milvus:19530
      AETHER_B2_MILVUS_PROJECTION: "${AETHER_B2_MILVUS_PROJECTION:-false}"
      AETHER_B2_VECTOR_DIMENSION: "512"
      AETHER_B1_EMBEDDING_URL: http://b1-sidecar:18081/v1/intercept
    volumes:
      - p3-data:/var/lib/aether-p3
    ports:
      - "${AETHER_HOST_P3_PORT:-8080}:8080"

  p3-session-worker:
    build:
      context: .
    command: ["aether-p3-session-worker"]
    depends_on:
      engine:
        condition: service_started
      redis:
        condition: service_healthy
      b1-sidecar:
        condition: service_healthy
    environment:
      AETHER_P2_GRPC: engine:50052
      AETHER_P2_ENGINE: object/default
      AETHER_P2_BUCKET: p3-memory
      AETHER_P2_COLLECTION: p3
      AETHER_RUNTIME_PROFILE: "${AETHER_RUNTIME_PROFILE:-integration}"
      AETHER_P3_DATA_DIR: /var/lib/aether-p3
      AETHER_B2_REDIS_URL: redis://redis:6379/0
      AETHER_B2_BROKER_URL: redis://redis:6379/0
      AETHER_B2_TASK_STATUS_URL: redis://redis:6379/2
      AETHER_B1_SIDECAR_URL: http://b1-sidecar:18081
      AETHER_B1_EMBEDDING_URL: http://b1-sidecar:18081/v1/intercept
      AETHER_P3_SESSION_WORKER_POLL_SECONDS: "${AETHER_P3_SESSION_WORKER_POLL_SECONDS:-1}"
      AETHER_P3_SESSION_WORKER_BATCH: "${AETHER_P3_SESSION_WORKER_BATCH:-100}"

  p3-projection-worker:
    build:
      context: .
    command: ["aether-p3-projection-worker"]
    depends_on:
      engine:
        condition: service_started
      redis:
        condition: service_healthy
      b1-sidecar:
        condition: service_healthy
    environment:
      AETHER_P2_GRPC: engine:50052
      AETHER_P2_ENGINE: object/default
      AETHER_P2_BUCKET: p3-memory
      AETHER_P2_COLLECTION: p3
      AETHER_RUNTIME_PROFILE: "${AETHER_RUNTIME_PROFILE:-integration}"
      AETHER_P3_DATA_DIR: /var/lib/aether-p3
      AETHER_B2_REDIS_URL: redis://redis:6379/0
      AETHER_B2_BROKER_URL: redis://redis:6379/0
      AETHER_B2_TASK_STATUS_URL: redis://redis:6379/2
      AETHER_B1_SIDECAR_URL: http://b1-sidecar:18081
      AETHER_B1_EMBEDDING_URL: http://b1-sidecar:18081/v1/intercept
      AETHER_P3_PROJECTION_WORKER_POLL_SECONDS: "${AETHER_P3_PROJECTION_WORKER_POLL_SECONDS:-1}"
      AETHER_P3_PROJECTION_WORKER_BATCH: "${AETHER_P3_PROJECTION_WORKER_BATCH:-100}"

  p3-context-projection-worker:
    build:
      context: .
    command: ["aether-p3-context-projection-worker"]
    depends_on:
      engine:
        condition: service_started
      redis:
        condition: service_healthy
      b1-sidecar:
        condition: service_healthy
    environment:
      AETHER_P2_GRPC: engine:50052
      AETHER_P2_ENGINE: object/default
      AETHER_P2_BUCKET: p3-memory
      AETHER_P2_COLLECTION: p3
      AETHER_RUNTIME_PROFILE: "${AETHER_RUNTIME_PROFILE:-integration}"
      AETHER_P3_DATA_DIR: /var/lib/aether-p3
      AETHER_B2_REDIS_URL: redis://redis:6379/0
      AETHER_B2_BROKER_URL: redis://redis:6379/0
      AETHER_B2_TASK_STATUS_URL: redis://redis:6379/2
      AETHER_B1_SIDECAR_URL: http://b1-sidecar:18081
      AETHER_B1_EMBEDDING_URL: http://b1-sidecar:18081/v1/intercept
      AETHER_P3_CONTEXT_PROJECTION_WORKER_POLL_SECONDS: "${AETHER_P3_CONTEXT_PROJECTION_WORKER_POLL_SECONDS:-1}"
      AETHER_P3_CONTEXT_PROJECTION_WORKER_BATCH: "${AETHER_P3_CONTEXT_PROJECTION_WORKER_BATCH:-100}"

  celery-worker:
    build:
      context: .
    command: ["celery", "-A", "aether_agent_memory.b2.celery_app", "worker", "--loglevel=INFO"]
    depends_on:
      engine:
        condition: service_started
      redis:
        condition: service_healthy
      b1-sidecar:
        condition: service_healthy
    environment:
      AETHER_P2_GRPC: engine:50052
      AETHER_P2_BUCKET: p3-memory
      AETHER_P2_COLLECTION: p3
      AETHER_RUNTIME_PROFILE: "${AETHER_RUNTIME_PROFILE:-integration}"
      AETHER_B2_BROKER_URL: redis://redis:6379/0
      AETHER_B2_RESULT_BACKEND: redis://redis:6379/1
      AETHER_B2_TASK_STATUS_URL: redis://redis:6379/2
      AETHER_B2_MILVUS_URI: http://milvus:19530
      AETHER_B2_MILVUS_COLLECTION: b2_memory_chunks_v3
      AETHER_B2_MILVUS_PROJECTION: "${AETHER_B2_MILVUS_PROJECTION:-false}"
      AETHER_B2_VECTOR_DIMENSION: "512"
      AETHER_B1_EMBEDDING_URL: http://b1-sidecar:18081/v1/intercept

  p3-demo:
    build:
      context: .
    command: ["python", "scripts/run_compose_smoke.py"]
    depends_on:
      p3:
        condition: service_started
      celery-worker:
        condition: service_started
    environment:
      AETHER_P3_BASE_URL: http://p3:8080
    profiles: ["demo"]

  p4-simulator:
    build:
      context: .
    command: ["python", "scripts/p4_simulator.py"]
    depends_on:
      p3:
        condition: service_started
    environment:
      AETHER_P3_BASE_URL: http://p3:8080
      AETHER_P4_PORT: "8090"
    ports:
      - "${AETHER_HOST_P4_PORT:-8090}:8090"
    profiles: ["p4"]

volumes:
  redis-data:
  b1-model-cache:
  engine-data:
  p3-data:
