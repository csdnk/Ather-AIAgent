<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>P2 接口消费 Mock</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f5f2;color:#203737;font-family:"Microsoft YaHei",sans-serif;line-height:1.7}main{max-width:1200px;margin:auto;padding:48px 32px}h1{font-size:36px;line-height:1.3;margin:16px 0}h2{font-size:24px;margin-top:40px}a{color:#14675f;text-decoration-thickness:1px;text-underline-offset:4px}header{border-bottom:2px solid #24574e;padding-bottom:26px}.kicker{color:#54675e;letter-spacing:2px;font-size:13px}.lead{font-size:18px;max-width:900px}.notice{padding:16px 0;color:#665223;border-bottom:1px solid #d2d8d1}table{width:100%;border-collapse:collapse;background:white;margin-top:20px}td,th{text-align:left;padding:15px 14px;border-bottom:1px solid #dae1db;vertical-align:top}th{background:#e6ece6}button{font:inherit;border:1px solid #648c7c;background:white;color:#24574e;padding:10px 20px;cursor:pointer;border-radius:5px}button.active,button.primary{background:#24574e;color:white}button:disabled{opacity:.45;cursor:default}.toolbar{display:flex;flex-wrap:wrap;gap:12px;margin:24px 0}.split{display:grid;grid-template-columns:1fr 1fr;gap:32px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#e5ece6;padding:20px;font:15px/1.65 Consolas,monospace}section{margin:32px 0}footer{margin-top:40px;color:#657369;font-size:13px}.step{font-size:20px;font-weight:600}article{border-top:1px solid #c7d1c8;padding-top:16px}.status{font-size:22px;color:#24574e}input{font:inherit;padding:10px;width:100%;border:1px solid #9eb2a7;background:white}@media(max-width:700px){main{padding:24px 18px}h1{font-size:29px}.split{grid-template-columns:1fr}table{font-size:13px}td,th{padding:10px 6px}}</style><main><header><div class="kicker">AETHER / P2 CONSUMER MOCK</div><h1>调用方怎样使用 P2 三态能力</h1><p class="lead">逐步查看输入、期望输出与异常处理，用于核对P2/P3接口边界。</p></header><p class="notice">全部是离线模拟。字段是逻辑评审样例，不是冻结的RPC Schema；Graph/Fusion尚未在当前ae-grpc挂载；冷热物理分层仍待确认。</p><div class="toolbar"><a href="../项目总览/index.html">项目总览</a><a href="index.html#scenario=S07">P3关联场景</a><a id="epic">对应Epic五件套</a></div><nav class="toolbar" id="nav"></nav><h2 id="title"></h2><p id="question"></p><div class="toolbar"><button class="primary" id="next">执行下一步</button><button id="reset">重置</button><button id="export">导出模拟记录</button></div><p class="step" id="step">等待操作</p><div class="split"><article><h2>调用输入</h2><pre id="request">{}</pre></article><article><h2>期望输出</h2><pre id="response">{}</pre></article></div><p class="status" id="status">尚未开始</p><footer>此原型验证评审路径，不证明真实P2实现已通过。实际验收必须运行TC-P2-01~04。</footer></main><script>const scenes=[{"id": "P201", "title": "对象保存与精确读取", "epic": "EP-P2-01", "question": "P3拿到的正文，是否属于同一个已保存版本？", "steps": [["提交对象", "PutObject（逻辑样例）", {"bucket": "project", "key": "meeting", "body": "预算20万元", "version": "v1"}, {"status": "saved", "object_ref": "obj-001", "version": "v1", "digest": "示例摘要A"}], ["读取准确版本", "GetObject（逻辑样例）", {"object_ref": "obj-001", "version": "v1"}, {"status": "ok", "body": "预算20万元", "version": "v1", "digest": "示例摘要A"}], ["模拟摘要不匹配", "P3正文核验", {"expected_digest": "示例摘要A", "actual_digest": "示例摘要B"}, {"status": "rejected", "reason": "正文不匹配，不交付错误内容"}], ["模拟重启后回读", "恢复后GetObject（模拟）", {"object_ref": "obj-001", "version": "v1"}, {"status": "ok", "body": "预算20万元", "evidence": "仅场景预设，不是WAL恢复实测"}]]}, {"id": "P202", "title": "向量候选与对象引用", "epic": "EP-P2-02", "question": "索引命中之后，P3如何确认没有使用越权或过期内容？", "steps": [["准备向量与绑定", "InsertVector（逻辑样例）", {"dimension": 512, "object_ref": "obj-001", "memory_version": 1, "scope": "tenant-a"}, {"status": "pending", "reason": "受理不等于可查询"}], ["模拟索引就绪", "Provider可查询性核对", {"object_ref": "obj-001", "memory_version": 1}, {"status": "ready", "evidence": "模拟索引查询证明"}], ["请求过滤检索", "SearchVector（逻辑样例）", {"scope": "tenant-a", "query": "当前预算", "top_k": 3}, {"status": "ok", "candidates": [{"object_ref": "obj-001", "memory_version": 1}]}], ["候选已过期", "Remember最终资格核验", {"candidate_version": 1, "current_version": 2}, {"status": "filtered", "reason": "候选不再有效，不交付20万元旧预算"}]]}, {"id": "P203", "title": "图关系与来源关联", "epic": "EP-P2-03", "question": "图的来源与对象正文是否关联到同一份内容？", "steps": [["建立来源与版本节点", "CreateNode / CreateEdge（逻辑样例）", {"source": "meeting-0918", "object_ref": "obj-001", "version": 1}, {"status": "created", "edge": "meeting-0918 -> obj-001@v1"}], ["遍历一跳来源", "Traverse（逻辑样例）", {"node": "obj-001@v1", "depth": 1}, {"status": "ok", "source": "meeting-0918", "version": 1}], ["关联正文", "图结果与GetObject联合核验", {"object_ref": "obj-001", "version": 1}, {"status": "matched", "body": "预算20万元"}], ["模拟引用缺失", "对象已撤回", {"object_ref": "obj-001", "deleted": true}, {"status": "unavailable", "reason": "不能把悬空图引用当作有效正文"}]]}, {"id": "P204", "title": "控制动作与未知收敛", "epic": "EP-P2-04", "question": "超时以后，怎样证明执行完成且没有重复发起动作？", "steps": [["查看当前观测", "SegmentIntrospection（逻辑能力）", {"target_ref": "opaque-01", "generation": 3}, {"observed": "warm", "route_version": 7}], ["提交唯一动作", "Execute（逻辑能力，非正式RPC）", {"action_id": "act-001", "target_ref": "opaque-01", "desired": "hot"}, {"status": "accepted", "observed": "warm"}], ["模拟回执丢失", "调用超时", {"action_id": "act-001"}, {"status": "unknown", "action_count": 1, "observed": "warm"}], ["查询原动作并准确回读", "Query original action + exact read", {"action_id": "act-001", "generation": 3}, {"status": "succeeded", "action_count": 1, "observed": "hot", "evidence": "模拟目标可读，非实际介质证据"}]]}];let selected=0,cursor=0,history=[];const $=id=>document.getElementById(id);function render(){const s=scenes[selected];$('nav').innerHTML=scenes.map((x,i)=>`<button data-i="${i}" class="${i===selected?'active':''}">${x.id} ${x.title}</button>`).join('');document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{location.hash='scenario='+scenes[+b.dataset.i].id;});$('title').textContent=s.title;$('question').textContent=s.question;$('epic').href='../EPIC/'+s.epic+'.md';$('next').disabled=cursor>=s.steps.length;}function reset(){cursor=0;history=[];$('request').textContent='{}';$('response').textContent='{}';$('step').textContent='等待操作';$('status').textContent='尚未开始';render();}function load(){const id=new URLSearchParams(location.hash.slice(1)).get('scenario');selected=Math.max(0,scenes.findIndex(s=>s.id===id));reset();}$('next').onclick=()=>{const x=scenes[selected].steps[cursor++];history.push({step:cursor,name:x[0],request:x[2],response:x[3]});$('step').textContent=cursor+'/4 '+x[0]+' · '+x[1];$('request').textContent=JSON.stringify(x[2],null,2);$('response').textContent=JSON.stringify(x[3],null,2);$('status').textContent='模拟结果：'+(x[3].status||x[3].observed);render();};$('reset').onclick=reset;$('export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({mode:'mock',scenario:scenes[selected].id,history},null,2)],{type:'application/json'}));a.download='p2-mock-'+scenes[selected].id+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};addEventListener('hashchange',load);load();</script></html>
