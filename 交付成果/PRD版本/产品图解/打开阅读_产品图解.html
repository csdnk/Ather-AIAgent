const notes=[`<h2>先理解产品由什么组成</h2><ol><li><b>对外只有两个核心功能。</b>Remember 保存和维护记忆，Recall 统一提供上下文。</li><li><b>内部处理各司其职。</b>当前状态可以直接更新；长期内容按适用规则加工。</li><li><b>三类记忆与三层访问分开。</b>当前、事件、稳定事实描述业务意义；热、温、冷描述访问准备。</li><li><b>调度在后台形成闭环。</b>两侧轨迹和当前状态驱动决策，核对执行结果后更新状态。</li></ol><p>上层应用负责调用时机、最终回答和业务执行。P1 预测预热是后续增强。</p>`,`<h2>再沿业务过程理解产品</h2><ol><li><b>A 写入。</b>可靠保存后按适用性分路；当前使用不等待长期加工。</li><li><b>B 召回。</b>选来源、核验读取、排序与冲突处理、按预算组装、交付前复核。</li><li><b>C 调度。</b>持续记录两侧变化；满足条件才调整，并核对实际效果。</li><li><b>D 维护。</b>更正、删除和失效约束之后的读取、派生结果及后台任务。</li></ol><p>四种召回结果必须区分：完整可用、正常为空、降级可用、不可用。来源故障不能被伪装成正常空。</p>`];
let current=0,factor=1;
const canvas=document.getElementById('canvas'),img=document.getElementById('diagram');
function resize(){img.style.width=Math.round(diagrams[current].w*factor)+'px';document.getElementById('scale').textContent=Math.round(factor*100)+'%'}
function fit(){factor=(canvas.clientWidth-38)/diagrams[current].w;resize()}
function zoom(delta){factor=Math.max(.2,Math.min(2.5,factor+delta));resize()}
function choose(n){current=n;img.src=diagrams[n].uri;img.alt='AetherBrain P3 '+diagrams[n].title;document.getElementById('notes').innerHTML=notes[n];for(let i=0;i<2;i++){document.getElementById('tab'+i).classList.toggle('active',i===n);document.getElementById('tab'+i).setAttribute('aria-pressed',String(i===n))}for(const ext of ['svg','png'])document.getElementById(ext).href=diagrams[n].name+'.'+ext;canvas.scrollTop=0;canvas.scrollLeft=0;fit()}
choose(0);
</script></html>
