<text x="955" y="239" font-family="Microsoft YaHei, SimSun, sans-serif" font-size="20" fill="#566879" font-weight="400" text-anchor="start">问题、范围、来源与长度预算</text>
<path d="M305,344 L305,385" fill="none" stroke="#627d90" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arr)"/>
<path d="M925,344 L925,385" fill="none" stroke="#627d90" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arr)"/>
<g id="remember">
<rect x="70" y="385" width="470" height="225" rx="14" fill="#dcecf3" stroke="#627d90" stroke-width="1.5"/>
<text x="90" y="420" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="24" fill="#293748" font-weight="700" text-anchor="start">01  Remember 存储记忆</text>
<text x="90" y="455" font-family="Microsoft YaHei, SimSun, sans-serif" font-size="22" fill="#293748" font-weight="400" text-anchor="start">接收事件、任务状态、长文本与文档</text>
<text x="90" y="487" font-family="Microsoft YaHei, SimSun, sans-serif" font-size="22" fill="#293748" font-weight="400" text-anchor="start">可靠保存内容和来源，维护有效版本</text>
<text x="90" y="519" font-family="Microsoft YaHei, SimSun, sans-serif" font-size="22" fill="#293748" font-weight="400" text-anchor="start">提供更正、删除及处理查询</text>
<text x="90" y="551" font-family="Microsoft YaHei, SimSun, sans-serif" font-size="22" fill="#293748" font-weight="400" text-anchor="start">返回：记忆引用、保存结果、处理状态</text>
</g>
<g id="recall">
<rect x="590" y="385" width="670" height="225" rx="14" fill="#dcecf3" stroke="#627d90" stroke-width="1.5"/>
<text x="610" y="420" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="24" fill="#293748" font-weight="700" text-anchor="start">02  Recall 统一召回入口</text>
<text x="610" y="455" font-family="Microsoft YaHei, SimSun, sans-serif" font-size="22" fill="#293748" font-weight="400" text-anchor="start">应用直接调用与 Agent 工具调用共用同一规则</text>
<text x="610" y="487" font-family="Microsoft YaHei, SimSun, sans-serif" font-size="22" fill="#293748" font-weight="400" text-anchor="start">选来源 → 检索并核验 → 排序去重与冲突分组</text>
<text x="610" y="519" font-family="Microsoft YaHei, SimSun, sans-serif" font-size="22" fill="#293748" font-weight="400" text-anchor="start">按预算组装 → 交付前复核权限与有效性</text>
<text x="610" y="551" font-family="Microsoft YaHei, SimSun, sans-serif" font-size="22" fill="#293748" font-weight="400" text-anchor="start">返回：上下文、来源、冲突及完整性状态</text>
</g>
