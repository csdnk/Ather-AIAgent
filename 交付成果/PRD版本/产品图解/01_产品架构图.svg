<text x="1395" y="800" font-family="Microsoft YaHei, SimSun, sans-serif" font-size="22" fill="#293748" font-weight="400" text-anchor="start">权限、有效性、容量与操作冲突</text>
<text x="1395" y="832" font-family="Microsoft YaHei, SimSun, sans-serif" font-size="22" fill="#293748" font-weight="400" text-anchor="start">自动执行；核对实际状态和可读性</text>
</g>
