<svg xmlns="http://www.w3.org/2000/svg" width="1880" height="1440" viewBox="0 0 1880 1440" role="img"><title>AetherBrain P3 产品架构图</title><desc>依据 AetherBrain P3 PRD V1.2 绘制的产品设计图，并非当前实现或验收结果。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#627d90"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#277e85"/></marker></defs>
<text x="40" y="49" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="32" fill="#293748" font-weight="700" text-anchor="start">AetherBrain P3 产品架构图</text>
<g id="end-user">
<rect x="40" y="85" width="290" height="115" rx="14" fill="#e2eee5" stroke="#627d90" stroke-width="1.5"/>
<text x="60" y="120" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="24" fill="#293748" font-weight="700" text-anchor="start">终端业务用户</text>
<text x="60" y="155" font-family="Microsoft YaHei, SimSun, sans-serif" font-size="22" fill="#293748" font-weight="400" text-anchor="start">持续对话与任务</text>
</g>
<g id="upstream-app">
<rect x="420" y="85" width="1420" height="115" rx="14" fill="#dcecf3" stroke="#627d90" stroke-width="1.5"/>
<text x="440" y="120" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="24" fill="#293748" font-weight="700" text-anchor="start">上层应用／Agent · RAG · Workflow</text>
<text x="440" y="155" font-family="Microsoft YaHei, SimSun, sans-serif" font-size="22" fill="#293748" font-weight="400" text-anchor="start">决定何时存储、何时召回；使用 P3 返回的记忆材料，生成回答、执行工具并推进业务</text>
</g>
<path d="M330,142 L420,142" fill="none" stroke="#627d90" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="40" y="255" width="1800" height="985" rx="22" fill="#eeeee5" stroke="none" stroke-width="1.5"/>
<rect x="70" y="280" width="1740" height="64" rx="12" fill="#293748" stroke="none" stroke-width="1.5"/>
<text x="95" y="320" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="27" fill="white" font-weight="700" text-anchor="start">P3 多租户记忆服务</text>
<text x="420" y="319" font-family="Microsoft YaHei, SimSun, sans-serif" font-size="22" fill="white" font-weight="400" text-anchor="start">可信身份 → 租户归属 → 资源范围 → 操作权限；校验贯穿请求、后台处理与再次获取</text>
<path d="M680,200 L680,228 L305,228 L305,280" fill="none" stroke="#627d90" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
