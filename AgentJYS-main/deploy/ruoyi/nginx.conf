server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    location = /healthz { access_log off; return 200 'ok'; }
    location = /ruoyi { return 308 /ruoyi/; }
    location /ruoyi/ {
        try_files $uri $uri/ /ruoyi/index.html;
        add_header X-Content-Type-Options nosniff always;
    }
    location / { return 404; }
}
