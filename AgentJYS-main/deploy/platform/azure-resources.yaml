apiVersion: v1
data:
  __init__.py: ''
  directory.py: "\"\"\"Business identity authority. All public operations recheck\
    \ current authority.\n\nThis increment supplies directory reads, profile edits\
    \ and fail-closed disabling.\nOutbox completion and account enable/transfer require\
    \ the projection worker.\n\"\"\"\n\nimport hashlib\nimport json\nimport re\nfrom\
    \ collections.abc import Iterator\nfrom contextlib import contextmanager\nfrom\
    \ dataclasses import dataclass\nfrom typing import Any, cast\n\nimport psycopg\n\
    from psycopg import sql\nfrom psycopg.rows import dict_row\nfrom psycopg.types.json\
    \ import Jsonb\n\n\nclass AccessDeniedError(ValueError):\n    \"\"\"The current\
    \ business identity cannot perform this operation.\"\"\"\n\n\n@dataclass(frozen=True)\n\
    class Actor:\n    id: str\n    issuer: str\n    subject: str\n    tenant_id: str\
    \ | None\n    role: str\n    version: int\n\n\nSCHEMA = \"\"\"\nCREATE TABLE IF\
    \ NOT EXISTS fixture_installation (\n    singleton boolean PRIMARY KEY DEFAULT\
    \ true CHECK (singleton), dataset text NOT NULL\n);\nCREATE TABLE IF NOT EXISTS\
    \ tenants (\n    id text PRIMARY KEY, name text NOT NULL, enabled boolean NOT\
    \ NULL\n);\nCREATE TABLE IF NOT EXISTS users (\n    id text PRIMARY KEY, issuer\
    \ text NOT NULL, subject text NOT NULL,\n    username text NOT NULL UNIQUE, display_name\
    \ text NOT NULL,\n    tenant_id text REFERENCES tenants(id),\n    role text NOT\
    \ NULL CHECK (role IN ('platform_admin','tenant_admin','user')),\n    enabled\
    \ boolean NOT NULL, version integer NOT NULL DEFAULT 1,\n    sync_status text\
    \ NOT NULL DEFAULT 'identity_only',\n    UNIQUE(issuer, subject),\n    CHECK ((role\
    \ = 'platform_admin' AND tenant_id IS NULL)\n        OR (role IN ('tenant_admin','user')\
    \ AND tenant_id IS NOT NULL))\n);\nCREATE TABLE IF NOT EXISTS identity_commands\
    \ (\n    id text PRIMARY KEY, actor_id text NOT NULL REFERENCES users(id),\n \
    \   target_id text NOT NULL REFERENCES users(id), fingerprint text NOT NULL,\n\
    \    payload jsonb NOT NULL, result jsonb NOT NULL,\n    status text NOT NULL\
    \ DEFAULT 'pending', created_at timestamptz NOT NULL DEFAULT now()\n);\nCREATE\
    \ TABLE IF NOT EXISTS audit_events (\n    id bigint GENERATED ALWAYS AS IDENTITY\
    \ PRIMARY KEY,\n    command_id text NOT NULL UNIQUE REFERENCES identity_commands(id),\n\
    \    actor_id text NOT NULL, target_id text NOT NULL,\n    action text NOT NULL,\
    \ created_at timestamptz NOT NULL DEFAULT now()\n);\n\"\"\"\n\n\nclass Directory:\n\
    \    def __init__(self, dsn: str, *, schema: str = \"aether_platform\") -> None:\n\
    \        if not re.fullmatch(r\"[a-z][a-z0-9_]{0,62}\", schema):\n           \
    \ raise ValueError(\"Invalid database schema\")\n        self.dsn, self.schema\
    \ = dsn, schema\n\n    @contextmanager\n    def connection(self) -> Iterator[psycopg.Connection[dict[str,\
    \ Any]]]:\n        with psycopg.connect(self.dsn, row_factory=dict_row) as conn:\n\
    \            conn.execute(sql.SQL(\"SET LOCAL search_path TO {}\").format(sql.Identifier(self.schema)))\n\
    \            yield conn\n\n    def migrate(self) -> None:\n        with self.connection()\
    \ as conn:\n            conn.execute(\n                sql.SQL(\"CREATE SCHEMA\
    \ IF NOT EXISTS {}\").format(sql.Identifier(self.schema))\n            )\n   \
    \         conn.execute(SCHEMA)\n\n    def seed(\n        self, dataset: str, tenants:\
    \ list[dict[str, Any]], users: list[dict[str, Any]]\n    ) -> None:\n        \"\
    \"\"Lab bootstrap only; repeated imports preserve all maintained rows.\"\"\"\n\
    \        with self.connection() as conn:\n            conn.execute(\"SELECT pg_advisory_xact_lock(190102026)\"\
    )\n            installed = conn.execute(\"SELECT dataset FROM fixture_installation\"\
    ).fetchone()\n            if installed and installed[\"dataset\"] != dataset:\n\
    \                raise ValueError(\"Database belongs to a different fixture dataset\"\
    )\n            if not installed:\n                if conn.execute(\"SELECT 1 FROM\
    \ users LIMIT 1\").fetchone():\n                    raise ValueError(\"Refusing\
    \ to seed a non-fixture directory\")\n                conn.execute(\"INSERT INTO\
    \ fixture_installation(dataset) VALUES (%s)\", (dataset,))\n            for tenant\
    \ in tenants:\n                conn.execute(\n                    \"INSERT INTO\
    \ tenants(id,name,enabled) VALUES (%s,%s,%s) \"\n                    \"ON CONFLICT\
    \ (id) DO NOTHING\",\n                    (tenant[\"id\"], tenant[\"name\"], tenant[\"\
    enabled\"]),\n                )\n            for user in users:\n            \
    \    conn.execute(\n                    \"INSERT INTO users(id,issuer,subject,username,display_name,\"\
    \n                    \"tenant_id,role,enabled) VALUES (%s,%s,%s,%s,%s,%s,%s,%s)\
    \ \"\n                    \"ON CONFLICT (id) DO NOTHING\",\n                 \
    \   tuple(\n                        user[k]\n                        for k in\
    \ (\n                            \"id\",\n                            \"issuer\"\
    ,\n                            \"subject\",\n                            \"username\"\
    ,\n                            \"display_name\",\n                           \
    \ \"tenant_id\",\n                            \"role\",\n                    \
    \        \"enabled\",\n                        )\n                    ),\n   \
    \             )\n\n    @staticmethod\n    def _authenticate(conn: psycopg.Connection[dict[str,\
    \ Any]], issuer: str, subject: str) -> Actor:\n        row = conn.execute(\n \
    \           \"SELECT u.* FROM users u LEFT JOIN tenants t ON u.tenant_id=t.id\
    \ \"\n            \"WHERE u.issuer=%s AND u.subject=%s AND u.enabled \"\n    \
    \        \"AND (u.tenant_id IS NULL OR t.enabled)\",\n            (issuer, subject),\n\
    \        ).fetchone()\n        if not row:\n            raise AccessDeniedError(\"\
    Identity is unavailable\")\n        return Actor(**{k: row[k] for k in Actor.__dataclass_fields__})\n\
    \n    def authenticate(self, issuer: str, subject: str) -> Actor:\n        with\
    \ self.connection() as conn:\n            return self._authenticate(conn, issuer,\
    \ subject)\n\n    def _admin(self, conn: psycopg.Connection[dict[str, Any]], actor:\
    \ Actor) -> Actor:\n        current = self._authenticate(conn, actor.issuer, actor.subject)\n\
    \        if current != actor or current.role not in {\"platform_admin\", \"tenant_admin\"\
    }:\n            raise AccessDeniedError(\"Administration is unavailable\")\n \
    \       return current\n\n    def list_users(self, actor: Actor) -> list[dict[str,\
    \ Any]]:\n        with self.connection() as conn:\n            actor = self._admin(conn,\
    \ actor)\n            return conn.execute(\n                \"SELECT id,username,display_name,tenant_id,role,enabled,\"\
    \n                \"version,sync_status FROM users \"\n                \"WHERE\
    \ (%s OR tenant_id=%s) ORDER BY username\",\n                (actor.role == \"\
    platform_admin\", actor.tenant_id),\n            ).fetchall()\n\n    def get_user(self,\
    \ actor: Actor, user_id: str) -> dict[str, Any]:\n        for row in self.list_users(actor):\n\
    \            if row[\"id\"] == user_id:\n                return row\n        raise\
    \ AccessDeniedError(\"User is unavailable\")\n\n    def update_user(\n       \
    \ self, actor: Actor, user_id: str, changes: dict[str, Any], command_id: str\n\
    \    ) -> dict[str, Any]:\n        if not changes or set(changes) - {\"display_name\"\
    , \"enabled\"}:\n            raise AccessDeniedError(\"Unsupported account change\"\
    )\n        if \"display_name\" in changes and (\n            not isinstance(changes[\"\
    display_name\"], str)\n            or not 1 <= len(changes[\"display_name\"].strip())\
    \ <= 120\n        ):\n            raise ValueError(\"Invalid display name\")\n\
    \        if \"enabled\" in changes and changes[\"enabled\"] is not False:\n  \
    \          raise AccessDeniedError(\"Enabling requires verified identity projections\"\
    )\n        if not command_id or len(command_id) > 128:\n            raise ValueError(\"\
    Invalid command identifier\")\n        fingerprint = hashlib.sha256(\n       \
    \     json.dumps([user_id, changes], sort_keys=True).encode()\n        ).hexdigest()\n\
    \        with self.connection() as conn:\n            # Serialize business writes,\
    \ including last-admin checks and bootstrap.\n            conn.execute(\"SELECT\
    \ pg_advisory_xact_lock(190102026)\")\n            actor = self._admin(conn, actor)\n\
    \            target = conn.execute(\n                \"SELECT * FROM users WHERE\
    \ id=%s FOR UPDATE\", (user_id,)\n            ).fetchone()\n            if not\
    \ target or (\n                actor.role == \"tenant_admin\"\n              \
    \  and (target[\"tenant_id\"] != actor.tenant_id or target[\"role\"] != \"user\"\
    )\n            ):\n                raise AccessDeniedError(\"User is unavailable\"\
    )\n            old = conn.execute(\n                \"SELECT * FROM identity_commands\
    \ WHERE id=%s\", (command_id,)\n            ).fetchone()\n            if old:\n\
    \                if old[\"actor_id\"] != actor.id or old[\"fingerprint\"] != fingerprint:\n\
    \                    raise ValueError(\"Command identifier already used\")\n \
    \               return cast(dict[str, Any], old[\"result\"])\n            if target[\"\
    role\"] == \"platform_admin\" and changes.get(\"enabled\") is False:\n       \
    \         counted = conn.execute(\n                    \"SELECT count(*) AS n\
    \ FROM users WHERE role='platform_admin' AND enabled\"\n                ).fetchone()\n\
    \                assert counted is not None\n                if counted[\"n\"\
    ] <= 1:\n                    raise AccessDeniedError(\"The last platform administrator\
    \ must remain enabled\")\n            name = changes.get(\"display_name\", target[\"\
    display_name\"])\n            enabled = changes.get(\"enabled\", target[\"enabled\"\
    ])\n            row = conn.execute(\n                \"UPDATE users SET display_name=%s,enabled=%s,version=version+1,\"\
    \n                \"sync_status='pending' WHERE id=%s RETURNING id,display_name,\"\
    \n                \"enabled,version,sync_status\",\n                (name, enabled,\
    \ user_id),\n            ).fetchone()\n            assert row is not None\n  \
    \          result = {**row, \"command_id\": command_id}\n            conn.execute(\n\
    \                \"INSERT INTO identity_commands(id,actor_id,target_id,fingerprint,payload,result)\
    \ \"\n                \"VALUES (%s,%s,%s,%s,%s,%s)\",\n                (command_id,\
    \ actor.id, user_id, fingerprint, Jsonb(changes), Jsonb(result)),\n          \
    \  )\n            conn.execute(\n                \"INSERT INTO audit_events(command_id,actor_id,target_id,action)\
    \ \"\n                \"VALUES (%s,%s,%s,'update_user')\",\n                (command_id,\
    \ actor.id, user_id),\n            )\n            return result\n"
  projection.py: "\"\"\"Publish authoritative platform identities beside P3, without\
    \ desktop tunnels.\"\"\"\n\nimport argparse\nimport json\nimport time\nfrom pathlib\
    \ import Path\n\nimport httpx\nimport yaml\n\nfrom aether_platform.directory import\
    \ Directory\n\n\ndef build_projection(tenants: list[dict], users: list[dict],\
    \ issuer: str) -> dict:\n    value = {\n        \"revision\": 1,\n        \"tenants\"\
    : [{\"tenant_id\": t[\"id\"], \"enabled\": t[\"enabled\"]} for t in tenants]\n\
    \        + [{\"tenant_id\": \"aether_platform_operations\", \"enabled\": True}],\n\
    \        \"identities\": [], \"jwt_issuers\": [],\n    }\n    mappings = []\n\
    \    for user in users:\n        if not user[\"enabled\"] or user[\"role\"] not\
    \ in {\"user\", \"platform_admin\"}:\n            continue\n        principal\
    \ = {\n            \"principal_id\": user[\"id\"],\n            \"home_scope\"\
    : {\"tenant_id\": user[\"tenant_id\"] or \"aether_platform_operations\",\n   \
    \                        \"user_id\": user[\"id\"], \"application_id\": \"agent-platform\"\
    , \"agent_id\": \"aether\"},\n            \"permissions\": [\"memory:read\", \"\
    memory:write\", \"memory:correct\", \"memory:delete\", \"memory:history\"]\n \
    \           if user[\"role\"] == \"user\" else [\"maintenance:diagnose\", \"maintenance:recover\"\
