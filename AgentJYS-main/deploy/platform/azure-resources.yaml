        - name: KC_HTTP_ENABLED
          value: 'true'
        - name: KC_HTTP_RELATIVE_PATH
          value: /identity
        - name: KC_PROXY_HEADERS
          value: xforwarded
        - name: KC_HEALTH_ENABLED
          value: 'true'
        image: quay.io/keycloak/keycloak:26.8.0
        imagePullPolicy: IfNotPresent
        name: aether-keycloak
        readinessProbe:
          failureThreshold: 6
          httpGet:
            path: /identity/realms/aether-lab/.well-known/openid-configuration
            port: 8080
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        resources:
          limits:
            cpu: '2'
            memory: 2Gi
          requests:
            cpu: 100m
            memory: 768Mi
        startupProbe:
          failureThreshold: 60
          httpGet:
            path: /identity/realms/aether-lab/.well-known/openid-configuration
            port: 8080
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
