apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    aether-owner: azure-platform-release-20261005
  name: aether-platform
  namespace: aether-p3-demo
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: aether-platform
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: aether-platform
    spec:
      automountServiceAccountToken: false
      containers:
      - command:
        - python
        - -B
        - -c
        - 'import hashlib,json,pathlib,os

          root=pathlib.Path(''/release/app'')

          expected=json.load(open(''/release/files.sha256.json''))

          assert all(hashlib.sha256((root/n).read_bytes()).hexdigest()==v for n,v
          in expected.items()),''Release checksum mismatch''

          os.execv(''/usr/local/bin/python'',[''python'',''-B'',''/release/app/run_cloud.py'',''--config'',''/config/private.json''])

          '
        env:
        - name: PYTHONPATH
          value: /release/app/src:/release/deps
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        - name: AETHER_RELEASE_SHA
          value: 527581392066211177acb96de7bf9188ed438df22325d951878f44d7c4dde3ec
        image: python:3.13-slim
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /agent/
            port: 19010
            scheme: HTTP
          initialDelaySeconds: 20
          periodSeconds: 15
          successThreshold: 1
          timeoutSeconds: 1
        name: aether-platform
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /agent/
            port: 19010
            scheme: HTTP
          initialDelaySeconds: 3
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: '2'
            memory: 2Gi
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 10001
          runAsNonRoot: true
          runAsUser: 10001
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /release
          name: release
          readOnly: true
        - mountPath: /config
          name: config
          readOnly: true
        - mountPath: /identity-config
          name: identity
          readOnly: true
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 10001
      terminationGracePeriodSeconds: 30
      volumes:
      - name: release
        persistentVolumeClaim:
          claimName: aether-platform-release
      - name: config
        secret:
          defaultMode: 420
          secretName: aether-platform-config
      - name: identity
        secret:
          defaultMode: 420
          items:
          - key: private.json
            path: private.json
          secretName: aether-identity-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    aether-owner: azure-platform-release-20261005
  name: aether-platform-db
  namespace: aether-p3-demo
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: aether-platform-db
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: aether-platform-db
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: POSTGRES_USER
          value: aether_lab
        - name: POSTGRES_DB
          value: aether_platform_lab
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: aether-platform-database
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        image: postgres:17.6
        imagePullPolicy: IfNotPresent
        name: aether-platform-db
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
            - -d
            - aether_platform_lab
          failureThreshold: 6
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        resources:
          limits:
            cpu: '2'
            memory: 2Gi
          requests:
            cpu: 100m
            memory: 512Mi
        startupProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
            - -d
            - aether_platform_lab
          failureThreshold: 60
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: data
        - mountPath: /docker-entrypoint-initdb.d
          name: init
          readOnly: true
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: aether-platform-database
      - name: init
        secret:
          defaultMode: 420
          items:
          - key: init.sql
            path: 01-keycloak.sql
          secretName: aether-platform-database
