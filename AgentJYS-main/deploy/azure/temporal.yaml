apiVersion: v1
kind: Namespace
metadata:
  name: aether-p3-production
  labels:
    app.kubernetes.io/part-of: aether-p3
---
apiVersion: v1
kind: Service
metadata:
  name: p3-temporal
  namespace: aether-p3-production
spec:
  selector:
    app: p3-temporal
  ports:
    - name: grpc-tls
      port: 7233
      targetPort: 7233
    - name: metrics
      port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: p3-temporal
  namespace: aether-p3-production
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: p3-temporal
  template:
    metadata:
      labels:
        app: p3-temporal
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: temporal
          # Build deploy/vm/Dockerfile.temporal, which includes the mTLS health CLI.
          image: REPLACE_WITH_REVIEWED_TEMPORAL_SERVER_CLI_IMAGE_DIGEST
          command: [/bin/sh, -ec]
          args:
            - |
              umask 0077
              awk '{gsub("__POD_IP__", ENVIRON["POD_IP"]); print}' /source-config/production.yaml > /runtime-config/production.yaml
              cp /source-config/dynamic.yaml /runtime-config/dynamic.yaml
              exec temporal-server --config-file /runtime-config/production.yaml start
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: grpc-tls
              containerPort: 7233
            - name: metrics
              containerPort: 9090
          startupProbe:
            exec:
              command: [temporal, --address, "127.0.0.1:7233", --tls-ca-path, /tls/ca.crt, --tls-cert-path, /tls/server.crt, --tls-key-path, /tls/server.key, operator, cluster, health]
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [temporal, --address, "127.0.0.1:7233", --tls-ca-path, /tls/ca.crt, --tls-cert-path, /tls/server.crt, --tls-key-path, /tls/server.key, operator, cluster, health]
            periodSeconds: 10
            timeoutSeconds: 4
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: grpc-tls
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /source-config
              readOnly: true
            - name: rendered-config
              mountPath: /runtime-config
            - name: tls
              mountPath: /tls
              readOnly: true
            - name: azure-ca
              mountPath: /azure-ca
              readOnly: true
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: config
          secret:
            secretName: p3-temporal-config
            defaultMode: 0440
        - name: tls
          secret:
            secretName: p3-temporal-server-tls
            defaultMode: 0440
        - name: azure-ca
          configMap:
            name: p3-azure-ca
        - name: temporary
          emptyDir: {}
        - name: rendered-config
          emptyDir:
            medium: Memory
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: p3-temporal-ingress
  namespace: aether-p3-production
spec:
  podSelector:
    matchLabels:
      app: p3-temporal
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: aether-p3-demo
          podSelector:
            matchLabels:
              app: p3-storage-validation
      ports:
        - protocol: TCP
          port: 7233
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9090
