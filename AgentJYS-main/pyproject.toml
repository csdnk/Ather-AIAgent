[project]
name = "aether-agent-memory"
version = "0.1.0"
description = "AetherBrain P3 — Embedding、Agent 记忆管理与语义分层调度闭环"
readme = "README.md"
authors = [{ name = "Jarstii", email = "xy_jxnu@163.com" }]
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.141.1,<1",
  "grpcio>=1.82.1,<2",
  "grpcio-tools>=1.82.1,<2",
  "httpx>=0.28.1,<1",
  "jieba>=0.42.1,<0.43",
  "opentelemetry-api>=1.43.0",
  "opentelemetry-sdk>=1.43.0",
  "opentelemetry-exporter-otlp-proto-http>=1.43.0,<2",
  "protobuf>=7.35.1,<8",
  "PyJWT[crypto]>=2.15.1,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic>=2.13.4",
  "PyYAML>=6.0.3,<7",
  "pydantic-settings>=2.14.2",
  "pymilvus>=2.5,<3",
  "redis>=5.2,<6",
  "rfc8785>=0.1.4,<1",
  "structlog>=26.1.0",
  "uvicorn>=0.35,<1",
  "tiktoken>=0.9,<1",
  "temporalio==1.33.0",
]

[project.optional-dependencies]
remember-postgres = [
  "psycopg[binary]>=3.2,<4",
  "psycopg-pool>=3.2,<4",
]
remember-ceph = [
  "boto3>=1.36,<2",
]
recall-rerank = [
  "sentence-transformers>=5,<6",
]
embedding-onnx = [
  "fastembed>=0.8.0,<0.9",
]
embedding-int8 = [
  "fastembed>=0.8.0,<0.9",
  "onnx>=1.17,<2",
]
embedding-openvino = [
  "nncf>=2.19,<4",
  "optimum-intel>=2.1,<3",
  "openvino>=2026.0,<2027",
  "transformers>=4.45,<6",
]
# Install a matching IPEX wheel from the Intel/PyTorch index first.
embedding-ipex = [
  "torch>=2.7,<3",
  "transformers>=4.45,<6",
]
# IPEX wheels are published through Intel/PyTorch-specific indexes rather than PyPI.
# Install a matching IPEX wheel first, then use this extra for the shared adapter deps.
resource-documents = [
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
]

[project.scripts]
aether-p3 = "aether_agent_memory.runtime.flows.cli:main"
aether-embedding-inspect = "aether_agent_memory.recall.embedding.__main__:main"
aether-p4-simulator = "aether_p4_simulator.server:main"

[dependency-groups]
dev = [
  "jsonschema==4.26.0",
  "lxml-stubs>=0.5,<1",
  "mypy>=2.1.0",
  "pre-commit>=4.6.0",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=7.1.0",
  "rfc3339-validator==0.1.4",
  "ruff>=0.15.20",
  "types-PyYAML>=6.0.12,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aether_agent_memory", "src/aether_p4_simulator", "src/aether_platform"]

# ── Ruff ──────────────────────────────────────────
[tool.ruff]
target-version = "py313"
src = ["src", "tests"]
line-length = 100
extend-exclude = ["src/aether_agent_memory/p2/generated"]

[tool.ruff.lint]
select = [
  "E", # pycodestyle errors
  "F", # pyflakes
  "I", # isort
  "N", # pep8-naming
  "W", # pycodestyle warnings
  "UP", # pyupgrade
  "B", # flake8-bugbear
  "SIM", # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = ["aether_agent_memory"]

# ── Pytest ────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: unit tests",
    "integration: integration tests (may require external services)",
    "temporal_server: requires the pinned real Temporal CLI",
    "sources: source selection and coverage tests",
    "embedding: query embedding and model space tests",
    "p0: Priority 0 - Critical functionality",
    "p1: Priority 1 - Important functionality",
    "p2: Priority 2 - Nice to have",
]
addopts = "-v --tb=short"

# ── Mypy ──────────────────────────────────────────
[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
explicit_package_bases = true
mypy_path = "src"
exclude = ["^src/aether_agent_memory/p2/generated/"]

[[tool.mypy.overrides]]
module = ["aether_agent_memory.p2.generated", "aether_agent_memory.p2.generated.*"]
follow_imports = "skip"
ignore_errors = true
ignore_missing_imports = true

# CrossEncoder is an optional extra; keep checking our adapter without downloading
# the model stack in the default CI environment.
[[tool.mypy.overrides]]
module = ["sentence_transformers.*"]
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "fastapi.*",
  "fastembed.*",
  "google.protobuf.*",
  "grpc.*",
  "jieba.*",
  "milvus_lite.*",
  "onnxruntime.*",
  "openvino.*",
  "optimum.*",
  "pymilvus.*",
  "redis.*",
  "textual.*",
  "torch.*",
  "transformers.*",
  "uvicorn.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "tests.*",
  "scripts.*",
]
ignore_errors = true

# ── Coverage ──────────────────────────────────────
[tool.coverage.run]
source = ["src/aether_agent_memory"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
