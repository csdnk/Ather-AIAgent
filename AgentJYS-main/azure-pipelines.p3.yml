# Azure Repos PR validation must also be bound through target branch policies.
trigger:
  branches:
    include:
      - '*'
pr:
  branches:
    include:
      - '*'
pool:
  vmImage: ubuntu-latest
jobs:
  - job: P3Gate
    displayName: P3 collaboration gate
    timeoutInMinutes: 30
    steps:
      - checkout: self
      - task: UsePythonVersion@0
        inputs:
          versionSpec: '3.13'
      - script: python -m pip install -r scripts/p3/requirements-collaboration.txt
        displayName: Install validation dependencies
      - script: python scripts/p3/ci_temporal_gate.py collaboration --directory "$(Agent.TempDirectory)/p3-temporal" --report "$(Agent.TempDirectory)/p3-gate.json"
        displayName: Validate P3 contracts and implementation
        env:
          PYTHONUTF8: '1'
          TIKTOKEN_CACHE_DIR: $(Agent.TempDirectory)/p3-tokenizers
      - task: PublishPipelineArtifact@1
        condition: succeededOrFailed()
        inputs:
          targetPath: $(Agent.TempDirectory)/p3-gate.json
          artifact: p3-gate-summary
