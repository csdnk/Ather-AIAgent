# Azure Repos PR validation must also be bound through target branch policies.
trigger:
  branches:
    include:
      - '*'
pr:
  branches:
    include:
      - '*'
pool:
  vmImage: ubuntu-latest
jobs:
  - job: P3Gate
    displayName: P3 source and contract checks
    timeoutInMinutes: 30
    steps:
      - checkout: self
      - task: UsePythonVersion@0
        inputs:
          versionSpec: '3.13'
      - script: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[embedding-onnx,resource-documents,remember-ceph]' --group dev
        workingDirectory: AgentJYS-main
        displayName: Install validation dependencies
      - script: |
          python -m ruff check src tests scripts
          python scripts/generate_proto.py
          python -m mypy --cache-dir "$(Agent.TempDirectory)/p3-mypy" src
          python scripts/p3/generate_schemas.py --check
        workingDirectory: AgentJYS-main
        displayName: Validate source and generated contracts
        env:
          PYTHONUTF8: '1'
          TIKTOKEN_CACHE_DIR: $(Agent.TempDirectory)/p3-tokenizers
      # Backend tests use scripts/p3/run_aks_tests.py and separately approved Azure credentials.
