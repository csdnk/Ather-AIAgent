# Standalone unified P3 deployment with the current Azure storage bundle.
# Required: validated images, deployment/service.yaml with profile=production,
# host=0.0.0.0 and data_dir=/runtime, Azure storage bundle and production Temporal.
# Missing storage credentials fail startup; this template is not release acceptance.
# docker compose -f compose.production.yaml up -d
services:
  p3:
    image: ${AETHER_P3_IMAGE:?Set the validated P3 image by digest}
    command: ["python", "-m", "aether_agent_memory", "serve", "--config", "/deployment/service.yaml", "--require-profile", "production"]
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    environment:
      AETHER_LLM_API_KEY: ${AETHER_LLM_API_KEY:-}
      AETHER_POSTGRES_DSN: ${AETHER_POSTGRES_DSN:-}
      AETHER_REDIS_PASSWORD: ${AETHER_REDIS_PASSWORD:-}
      AETHER_MILVUS_TOKEN: ${AETHER_MILVUS_TOKEN:-}
      AETHER_CEPH_ACCESS_KEY: ${AETHER_CEPH_ACCESS_KEY:-}
      AETHER_CEPH_SECRET_KEY: ${AETHER_CEPH_SECRET_KEY:-}
    volumes:
      - ${AETHER_DEPLOYMENT_DIR:?Set an absolute deployment directory}:/deployment:ro
      - ${AETHER_RUNTIME_DIR:?Set an absolute writable runtime directory}:/runtime
      - ${AETHER_MODELS_DIR:?Set an absolute prepared models directory}:/models:ro
    ports:
      - "127.0.0.1:${AETHER_HOST_P3_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/p3/readyz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
  web:
    image: ${AETHER_WEB_IMAGE:?Set the validated Web image by digest}
    restart: unless-stopped
    depends_on:
      p3:
        condition: service_healthy
    ports:
      - "127.0.0.1:${AETHER_HOST_WEB_PORT:-3000}:80"
