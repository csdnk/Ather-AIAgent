# Local engineering profile. Create identities with `aether-p3 init` first.
# The CLI manager prints its endpoint; copy it below. No implicit server startup.
profile: local
data_dir: ../deployment/state
identity_file: ../deployment/identities.yaml
host: 0.0.0.0
port: 8080
embedding_profile: lexical
temporal:
  # Stable for this business directory, including after a restart.
  deployment_id: p3-local
  endpoint: 127.0.0.1:7233
  namespace: default
  task_queue_prefix: p3
  connect_timeout_seconds: 10
poll_seconds: 0.25
periodic_seconds: 1
shutdown_seconds: 15
http_wait_seconds: 30
