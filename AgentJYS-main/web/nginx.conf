map $uri $aether_cache_control {
    default "no-cache";
    ~^/p3/ "no-store";
    ~^/p4-api/ "no-store";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    # Keep headers at one level: location add_header would disable inheritance.
    add_header Cache-Control $aether_cache_control always;
    include /etc/nginx/p4-location.conf;
    location /p3/ {
        # Match the default P3 document limit; P3 enforces its configured policy.
        client_max_body_size 64m;
        proxy_pass http://p3:8080;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_hide_header Cache-Control;
        # P3 allows http_wait_seconds up to 300; preserve its pending/job response.
        proxy_read_timeout 360s;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
