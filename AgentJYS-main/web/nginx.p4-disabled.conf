# Default deployment has no local demonstration runner.
location = /p4-api/api/v1/demo/scenarios {
    default_type application/json;
    return 200 '{"items":[],"enabled":false,"unavailable_reason":"该部署未启用本地演示"}';
}
location ^~ /p4-api/ {
    default_type application/json;
    return 503 '{"error":{"code":"demo_unavailable","message":"该部署未启用本地演示"}}';
}
