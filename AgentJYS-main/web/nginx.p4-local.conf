# Opt-in local Compose harness only; P4 shares the Web network namespace.
# Preserve Origin so the P4 allowlist still rejects cross-site mutations.
location ^~ /p4-api/api/v1/demo/ {
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:8090/api/v1/demo/;
    proxy_set_header Host 127.0.0.1:8090;
    proxy_set_header Origin $http_origin;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_hide_header Cache-Control;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
}
location ^~ /p4-api/ {
    default_type application/json;
    return 404 '{"error":{"code":"not_found","message":"No demonstration route"}}';
}
