# Single P3 service. Set service.yaml temporal.endpoint to an address reachable
# from this container. The loopback-only development CLI is for host execution;
# use a private-network Temporal server or an explicitly configured local proxy
# for containers. Validate TCP/gRPC reachability separately on each platform.
services:
  temporal-dev:
    profiles: [temporal-local]
    image: temporalio/temporal:1.9.1
    command: ["server", "start-dev", "--headless", "--ip", "0.0.0.0", "--db-filename", "/var/lib/temporal/temporal.db"]
    restart: unless-stopped
    volumes:
      - temporal-dev-data:/var/lib/temporal
    ports:
      - "127.0.0.1:${AETHER_HOST_TEMPORAL_PORT:-7233}:7233"
  web:
    build:
      context: ./web
    restart: unless-stopped
    depends_on:
      - p3
    ports:
      - "127.0.0.1:${AETHER_HOST_WEB_PORT:-3000}:80"
  p3:
    build:
      context: .
      dockerfile: Dockerfile.p3
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      AETHER_LLM_API_KEY: ${AETHER_LLM_API_KEY:-}
    volumes:
      - ${AETHER_DEPLOYMENT_DIR:?Set an absolute deployment directory}:/deployment
    ports:
      - "127.0.0.1:${AETHER_HOST_P3_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/p3/readyz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
  engine:
    profiles: [p2]
    build:
      context: ./engine
    restart: unless-stopped
    environment:
      AETHER_P2_DATA_DIR: /var/lib/aether-engine
    volumes:
      - p2-data:/var/lib/aether-engine
volumes:
  p2-data:
  temporal-dev-data:
