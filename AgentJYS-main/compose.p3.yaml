# Single P3 service. Set service.yaml temporal.endpoint to an address reachable
# from this container. The loopback-only development CLI is for host execution;
# use a private-network Temporal server or an explicitly configured local proxy
# for containers. Validate TCP/gRPC reachability separately on each platform.
services:
  p3:
    build:
      context: .
      dockerfile: Dockerfile.p3
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      AETHER_LLM_API_KEY: ${AETHER_LLM_API_KEY:-}
      AETHER_POSTGRES_DSN: ${AETHER_POSTGRES_DSN:-}
      AETHER_REDIS_PASSWORD: ${AETHER_REDIS_PASSWORD:-}
      AETHER_MILVUS_TOKEN: ${AETHER_MILVUS_TOKEN:-}
      AETHER_CEPH_ACCESS_KEY: ${AETHER_CEPH_ACCESS_KEY:-}
      AETHER_CEPH_SECRET_KEY: ${AETHER_CEPH_SECRET_KEY:-}
    volumes:
      - ${AETHER_DEPLOYMENT_DIR:?Set an absolute deployment directory}:/deployment:ro
      - ${AETHER_RUNTIME_DIR:?Set an absolute writable runtime directory}:/runtime
      - ${AETHER_MODELS_DIR:?Set an absolute prepared models directory}:/models:ro
    ports:
      - "127.0.0.1:${AETHER_HOST_P3_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/p3/readyz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
  engine:
    profiles: [p2]
    build:
      context: ./engine
    restart: unless-stopped
    environment:
      AETHER_P2_DATA_DIR: /var/lib/aether-engine
    volumes:
      - p2-data:/var/lib/aether-engine
volumes:
  p2-data:
