name: p3-collaboration
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p3-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # runner context is available at step scope, not in job-level env.
      - name: Configure external tokenizer cache
        run: echo "TIKTOKEN_CACHE_DIR=$RUNNER_TEMP/p3-tokenizers" >> "$GITHUB_ENV"
      - run: python -m pip install -r scripts/p3/requirements-collaboration.txt
      - run: python scripts/p3/ci_temporal_gate.py collaboration --directory "${{ runner.temp }}/p3-collaboration" --report "${{ runner.temp }}/p3-gate.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p3-gate-summary
          path: ${{ runner.temp }}/p3-gate.json
          if-no-files-found: warn
          retention-days: 14
