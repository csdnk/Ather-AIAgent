name: p3-foundation
on:
  push:
    paths:
      - 'src/aether_agent_memory/runtime/**'
      - 'src/aether_agent_memory/**/contracts/**'
      - 'tests/runtime/p3/**'
      - 'scripts/p3/**'
      - 'contracts/p3/**'
      - 'docs/p3/**'
      - '.github/workflows/p3-foundation.yml'
  pull_request:
    paths:
      - 'src/aether_agent_memory/runtime/**'
      - 'src/aether_agent_memory/**/contracts/**'
      - 'tests/runtime/p3/**'
      - 'scripts/p3/**'
      - 'contracts/p3/**'
      - 'docs/p3/**'
      - '.github/workflows/p3-foundation.yml'
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r scripts/p3/requirements-flows.txt
      - run: python scripts/p3/ci_temporal_gate.py foundation --directory "${{ runner.temp }}/p3-foundation"
