name: p3-flows
on:
  push:
    paths:
      - 'src/aether_agent_memory/**/basic/**'
      - 'src/aether_agent_memory/runtime/**'
      - 'src/aether_agent_memory/**/contracts/**'
      - 'tests/runtime/**'
      - 'contracts/p3/**'
      - 'scripts/p3/**'
      - 'docs/p3/**'
      - '.github/workflows/p3-flows.yml'
  pull_request:
    paths:
      - 'src/aether_agent_memory/**/basic/**'
      - 'src/aether_agent_memory/runtime/**'
      - 'src/aether_agent_memory/**/contracts/**'
      - 'tests/runtime/**'
      - 'contracts/p3/**'
      - 'scripts/p3/**'
      - 'docs/p3/**'
      - '.github/workflows/p3-flows.yml'
jobs:
  flows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r scripts/p3/requirements-flows.txt
      - run: python scripts/p3/validate_flows.py
