name: p3-contracts
on:
  push:
    paths:
      - 'src/aether_agent_memory/**/contracts/**'
      - 'contracts/p3/**'
      - 'docs/p3/**'
      - 'scripts/p3/**'
      - 'tests/contracts/p3/**'
      - '.github/workflows/p3-contracts.yml'
  pull_request:
    paths:
      - 'src/aether_agent_memory/**/contracts/**'
      - 'contracts/p3/**'
      - 'docs/p3/**'
      - 'scripts/p3/**'
      - 'tests/contracts/p3/**'
      - '.github/workflows/p3-contracts.yml'
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r scripts/p3/requirements.txt
      - run: python scripts/p3/validate_contracts.py
