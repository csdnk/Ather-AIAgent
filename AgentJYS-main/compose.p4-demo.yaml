# Local development/test harness. Apply only with compose.p3.yaml.
# Web stays published on host loopback; P4 never binds an external interface.
# docker compose -f compose.p3.yaml -f compose.p4-demo.yaml up -d --build
services:
  web:
    volumes:
      - ./web/nginx.p4-local.conf:/etc/nginx/p4-location.conf:ro
  p4-demo:
    build:
      context: .
      dockerfile: Dockerfile.p3
    command: ["python", "-m", "aether_p4_simulator.server"]
    init: true
    network_mode: "service:web"
    depends_on:
      web:
        condition: service_started
      p3:
        condition: service_healthy
    environment:
      AETHER_P4_BIND: "127.0.0.1"
      AETHER_P4_PORT: "8090"
      AETHER_P4_DEMO_ENABLED: "1"
      AETHER_P4_DEMO_P3_URL: "http://p3:8080"
      AETHER_P4_DEMO_CREDENTIAL_FILE: "/run/secrets/p3-demo-credential"
      AETHER_P4_DEMO_ORIGINS: '["http://127.0.0.1:${AETHER_HOST_WEB_PORT:-3000}","http://localhost:${AETHER_HOST_WEB_PORT:-3000}"]'
    volumes:
      - ${AETHER_DEPLOYMENT_DIR:?Set an absolute deployment directory}/credential:/run/secrets/p3-demo-credential:ro
