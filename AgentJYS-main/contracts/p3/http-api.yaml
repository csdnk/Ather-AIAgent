  - recall_id
  query_model: null
- method: GET
  path: /api/v2/operations/{operation_id}
  port: runtime.DiagnosticsPort.operation
  permission: object:read
  request_model: null
  response_model: runtime.OperationRecord
  success_status: 200
  idempotency_key_required: false
  example: positive-runtime.OperationRecord
  path_parameters:
  - operation_id
  query_model: null
- method: GET
  path: /api/v2/tasks/{task_id}
  port: runtime.DiagnosticsPort.task
  permission: object:read
  request_model: null
  response_model: runtime.TaskRecord
  success_status: 200
  idempotency_key_required: false
  example: positive-runtime.TaskRecord
  path_parameters:
  - task_id
  query_model: null
- method: GET
  path: /api/v2/status
  port: runtime.DiagnosticsPort.health
  permission: authenticated
  request_model: null
  response_model: runtime.HealthReport
  success_status: 200
  idempotency_key_required: false
  example: positive-runtime.HealthReport
  path_parameters: []
  query_model: null
