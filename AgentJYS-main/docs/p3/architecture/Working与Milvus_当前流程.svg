<text x="50" y="61" font-family="Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#142f50">Working 记忆 × 本地 Milvus</text>
<text x="50" y="100" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#62728b">当前实现流程 · 2026-10-01 · 原生 BGE / 官方 Milvus Lite / 统一 P3 服务</text>
<text x="50" y="161" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#315b97">写入与发布</text>
<text x="50" y="374" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#263d57">保存确认 ≠ 索引就绪。写入响应丢失时查询原操作；当前版本、授权与删除状态决定能否发布。</text>
<text x="50" y="412" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#263d57">索引记录保存引用与校验信息；权威正文仍由 Remember 及其正文后端负责。</text>
<text x="50" y="480" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#187c73">语义召回：Working 与长期共享向量机制，按来源隔离</text>
<text x="50" y="706" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#263d57">索引 pending / failed 进入来源覆盖；仅 pending 且无可交付内容时表达进行中，不能伪装为正常 empty。</text>
<text x="50" y="744" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#263d57">缺失依赖按实际原因处理；正常空结果需要所选来源正常完成。</text>
<text x="50" y="796" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#62728b">正文读取与安全边界</text>
