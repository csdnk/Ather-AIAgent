- id: PRD-3-6
  title: 场景完成标准
  kind: context
  source:
    section: '3.6'
    paragraph_start: 194
    paragraph_end: 195
    excerpt: 新会话能够基于当前有效预算和历史证据继续工作；更正前的预算不被默认为当前事实；删除的会议内容不再出现在新上下文中。后台调度能够改善后续访问准备，并且不阻塞正在进行的记忆写入和上下文返回。
