- id: PRD-2-4
  title: 衡量原则
  kind: context
  source:
    section: '2.4'
    paragraph_start: 120
    paragraph_end: 121
    excerpt: 正确性优先于数量：保存量、候选量和上下文长度不能代替有效记忆的复用。压缩不能以遗漏关键事实换取比例；预热不能以损害当前业务换取命中率。指标定义见第10章，产品验收见第12章。
