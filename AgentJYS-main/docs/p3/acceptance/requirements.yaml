- id: PRD-1-3
  title: 产品价值
  kind: context
  source:
    section: '1.3'
    paragraph_start: 73
    paragraph_end: 75
    excerpt: 对应用开发者，P3提供统一的记忆和上下文服务，减少手工拼接历史。对终端业务，P3使历史事实更容易被正确复用，支持持续完成任务。对接入与部署团队，P3通过响应、查询和运行记录说明保存、可检索、已交付及调度生效情况，便于定位异常。
  owner: RF
  collaborators:
