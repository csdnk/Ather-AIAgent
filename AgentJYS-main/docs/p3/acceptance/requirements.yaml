- id: PRD-3-5
  title: 用户需要看见什么
  kind: context
  source:
    section: '3.5'
    paragraph_start: 191
    paragraph_end: 193
    excerpt: 提交后需要看见“已保存”或明确失败；长文处理需要看见阶段与可检索状态；获取上下文需要看见有效内容、来源以及不完整原因；更正和删除需要看见对后续使用的影响。内部调度的依据和实际结果通过受控运行记录核对，不增加面向用户的调度操作入口。
  owner: RF
  collaborators:
  - B
  - A
  - C
  product_stage: P0
  implementation_batch: D0
  design_documents:
