- id: PRD-1-1
  title: 背景
  kind: context
  source:
    section: '1.1'
    paragraph_start: 48
    paragraph_end: 50
    excerpt: Agent在长周期任务中会持续积累目标、约束、事实、工具结果和阶段结论。单次对话结束后，这些信息仍可能影响下一轮任务；不同会话也可能需要复用历史信息。应用需要在合适的时间取回合适的记忆，并知道信息是否仍然有效。
