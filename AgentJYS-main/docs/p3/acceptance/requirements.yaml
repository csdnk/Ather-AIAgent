  kind: context
  source:
    section: '2.1'
    paragraph_start: 77
    paragraph_end: 78
    excerpt: P3是应用与底层存储执行能力之间的记忆服务。它对外提供存储记忆和召回记忆，管理内容有效性及使用过程；内部基础算法依据两条流程的历史轨迹和状态进行调度。
