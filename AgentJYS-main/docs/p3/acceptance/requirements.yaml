- id: PRD-5-2
  title: 两个功能如何协作
  kind: requirement
  source:
    section: '5.2'
    paragraph_start: 247
    paragraph_end: 249
    excerpt: Remember确认保存后，适用的当前记忆可供下一轮使用，长期加工按内容要求继续进行。Recall收到请求后，选择当时可用的当前与长期记忆并返回。调用时机由应用或Agent决定，两种触发方式使用同一个Recall接口。
