- id: PRD-3-4
  title: 连续任务示例
  kind: context
  source:
    section: '3.4'
    paragraph_start: 162
    paragraph_end: 190
    excerpt: 以一个持续数周的项目助手为例。用户最初提供“本阶段预算上限为20万元”和“每周五汇总进度”，随后提交会议记录、更新预算，并在新会话要求总结当前执行风险。以下金额和内容仅用于说明产品行为。
