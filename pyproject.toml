[project]
name = "aether-agent-memory"
version = "0.1.0"
description = "B2 Agent Memory Manager — AetherBrain (P3) 三层记忆管理与 Context Pack 构建"
readme = "README.md"
authors = [{ name = "Jarstii", email = "xy_jxnu@163.com" }]
requires-python = ">=3.13"
dependencies = [
  "grpcio>=1.81.1",
  "grpcio-tools>=1.81.1",
  "opentelemetry-api>=1.43.0",
  "opentelemetry-sdk>=1.43.0",
  "protobuf>=6.33.6",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.14.2",
  "structlog>=26.1.0",
]

[dependency-groups]
dev = [
  "mypy>=2.1.0",
  "pre-commit>=4.6.0",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=7.1.0",
  "ruff>=0.15.20",
]
demo = [
  "textual>=0.86.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aether_agent_memory"]

# ── Ruff ──────────────────────────────────────────
[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = [
  "E", # pycodestyle errors
  "F", # pyflakes
  "I", # isort
  "N", # pep8-naming
  "W", # pycodestyle warnings
  "UP", # pyupgrade
  "B", # flake8-bugbear
  "SIM", # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = ["aether_agent_memory"]

# ── Pytest ────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["unit: unit tests", "integration: integration tests (may require external services)"]
addopts = "-v --tb=short"

# ── Mypy ──────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["grpc.*", "google.protobuf.*"]
ignore_missing_imports = true

# ── Coverage ──────────────────────────────────────
[tool.coverage.run]
source = ["src/aether_agent_memory"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
