[project]
name = "aether-agent-memory"
version = "0.1.0"
description = "AetherBrain P3 — Embedding、Agent 记忆管理与语义分层调度闭环"
readme = "README.md"
authors = [{ name = "Jarstii", email = "xy_jxnu@163.com" }]
requires-python = ">=3.13"
dependencies = [
  "celery>=5.5,<6",
  "grpcio>=1.82.1,<2",
  "grpcio-tools>=1.82.1,<2",
  "httpx>=0.28.1,<1",
  "jieba>=0.42.1,<0.43",
  "opentelemetry-api>=1.43.0",
  "opentelemetry-sdk>=1.43.0",
  "protobuf>=7.35.1,<8",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.14.2",
  "pymilvus>=2.5,<3",
  "redis>=5.2,<6",
  "structlog>=26.1.0",
]

[project.optional-dependencies]
b1-real = [
  "fastembed>=0.8.0,<0.9",
]
b1-sidecar = [
  "fastapi>=0.141.1,<1",
  "fastembed>=0.8.0,<0.9",
  "threadpoolctl>=3.6.0,<4",
  "uvicorn>=0.35,<1",
]
b1-dashboard = [
  "textual>=0.86.0,<2",
]
b2-dataset = [
  "huggingface-hub>=0.31,<1",
  "pyarrow>=18,<20",
]

[project.scripts]
aether-b1-sidecar = "aether_agent_memory.b1.sidecar:main"
aether-b1-dashboard = "aether_agent_memory.b1.dashboard:main"
aether-b1-dataset = "aether_agent_memory.b1.dataset_runner:main"
aether-b1-download-model = "aether_agent_memory.b1.model_download:main"

[dependency-groups]
dev = [
  "mypy>=2.1.0",
  "pre-commit>=4.6.0",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=7.1.0",
  "ruff>=0.15.20",
]
demo = [
  "textual>=0.86.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aether_agent_memory"]

# ── Ruff ──────────────────────────────────────────
[tool.ruff]
target-version = "py313"
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = [
  "E", # pycodestyle errors
  "F", # pyflakes
  "I", # isort
  "N", # pep8-naming
  "W", # pycodestyle warnings
  "UP", # pyupgrade
  "B", # flake8-bugbear
  "SIM", # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = ["aether_agent_memory"]

# ── Pytest ────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["unit: unit tests", "integration: integration tests (may require external services)"]
addopts = "-v --tb=short"

# ── Mypy ──────────────────────────────────────────
[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
  "celery.*",
  "fastapi.*",
  "fastembed.*",
  "google.protobuf.*",
  "grpc.*",
  "jieba.*",
  "pymilvus.*",
  "redis.*",
  "textual.*",
  "uvicorn.*",
]
ignore_missing_imports = true

# ── Coverage ──────────────────────────────────────
[tool.coverage.run]
source = ["src/aether_agent_memory"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
