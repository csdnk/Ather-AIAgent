name: ci

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: AgentJYS-main
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Python package and dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[embedding-onnx,resource-documents,remember-ceph]' --group dev
      - name: Generate Python protobuf bindings
        run: python scripts/generate_proto.py
      - name: Ruff
        run: python -m ruff check src tests scripts
      - name: Mypy
        run: python -m mypy src
      - name: Check generated contracts
        run: python scripts/p3/generate_schemas.py --check
      - name: Recall address-first regression (isolated storage transports)
        env:
          PYTHONPATH: tests
        run: >-
          python -B -m pytest
          tests/unit/test_cache_locations.py
          tests/unit/test_cache_address_reads.py
          tests/unit/test_body_address_reads.py
          tests/unit/test_recall_address_assembly.py
          tests/unit/test_body_read_consumers.py
          --confcutdir=tests/unit -q -p no:cacheprovider
          --basetemp "${{ runner.temp }}/recall-address-tests"
      - name: Platform tests (external integrations explicitly opt in)
        run: python -B -m pytest tests/platform -q -p no:cacheprovider --basetemp "${{ runner.temp }}/platform-tests"
      - name: Build Python package
        run: python -m pip wheel --no-deps --wheel-dir "${{ runner.temp }}/p3-wheels" .
      # Real storage and recovery tests run in the manually approved AKS workflow.

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AgentJYS-main/engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo fmt
        run: cargo fmt --all -- --check
      - name: Cargo test
        run: cargo test --workspace

  platform-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install web build and test dependencies outside source
        run: npm install --prefix "${{ runner.temp }}/web-deps" --no-audit --no-fund react@19.2.0 react-dom@19.2.0 esbuild@0.28.0 jsdom@26.1.0
      - name: Test and build Agent web
        env:
          AETHER_WEB_DEPENDENCIES: ${{ runner.temp }}/web-deps
          AETHER_WEB_DIST: ${{ runner.temp }}/platform-web
          AETHER_PUBLIC_PATH: /agent
        run: |
          node --test platform-web/tests/*.test.mjs
          node scripts/platform/build_web.mjs
