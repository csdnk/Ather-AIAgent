name: ci

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: AgentJYS-main
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: AgentJYS-main/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: AgentJYS-main/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Python package and dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[embedding-onnx,resource-documents,remember-ceph]' --group dev
      - name: Generate Python protobuf bindings
        run: python scripts/generate_proto.py
      - name: Ruff
        run: python -m ruff check src tests scripts
      - name: Mypy
        run: python -m mypy src
      - name: Check generated contracts
        run: python scripts/p3/generate_schemas.py --check
      - name: Build Python package
        run: python -m pip wheel --no-deps --wheel-dir "${{ runner.temp }}/p3-wheels" .
      # Real storage and recovery tests run in the manually approved AKS workflow.

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AgentJYS-main/engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo fmt
        run: cargo fmt --all -- --check
      - name: Cargo test
        run: cargo test --workspace
