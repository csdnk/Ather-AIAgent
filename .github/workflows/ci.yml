name: ci

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: AgentJYS-main
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Python package and dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . -r scripts/p3/requirements-ci.txt
      - name: Generate Python protobuf bindings
        run: python scripts/generate_proto.py
      - name: Ruff
        run: python -m ruff check src tests scripts benchmarks
      - name: Mypy
        run: python -m mypy src
      - name: Pytest
        run: python -m pytest -q

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AgentJYS-main/engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo fmt
        run: cargo fmt --all -- --check
      - name: Cargo test
        run: cargo test --workspace
