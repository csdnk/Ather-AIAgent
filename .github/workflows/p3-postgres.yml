name: p3-postgres
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: AgentJYS-main
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: p3_ci
          POSTGRES_PASSWORD: p3-ci-only
          POSTGRES_DB: p3_test_observability
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U p3_ci -d p3_test_observability"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONUTF8: '1'
      # Disposable runner-local service only; never use deployment credentials here.
      P3_TEST_STATE_DSN: postgresql://p3_ci:p3-ci-only@127.0.0.1:5432/p3_test_observability
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e . -r scripts/p3/requirements-flows.txt
      - name: Run tenant, log and trace PostgreSQL tests (no skips)
        run: python scripts/p3/validate_postgres.py --directory "${{ runner.temp }}/p3-postgres"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p3-postgres-results
          path: |
            ${{ runner.temp }}/p3-postgres/postgres.junit.xml
            ${{ runner.temp }}/p3-postgres/postgres-summary.json
          if-no-files-found: warn
          retention-days: 14
