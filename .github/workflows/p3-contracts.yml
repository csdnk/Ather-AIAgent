name: p3-contracts
on:
  push:
    paths:
      - 'AgentJYS-main/src/aether_agent_memory/**/contracts/**'
      - 'AgentJYS-main/contracts/p3/**'
      - 'AgentJYS-main/docs/p3/**'
      - 'AgentJYS-main/scripts/p3/**'
      - 'AgentJYS-main/tests/contracts/p3/**'
      - '.github/workflows/p3-contracts.yml'
  pull_request:
    paths:
      - 'AgentJYS-main/src/aether_agent_memory/**/contracts/**'
      - 'AgentJYS-main/contracts/p3/**'
      - 'AgentJYS-main/docs/p3/**'
      - 'AgentJYS-main/scripts/p3/**'
      - 'AgentJYS-main/tests/contracts/p3/**'
      - '.github/workflows/p3-contracts.yml'
defaults:
  run:
    working-directory: AgentJYS-main
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r scripts/p3/requirements.txt
      - run: python scripts/p3/validate_contracts.py
